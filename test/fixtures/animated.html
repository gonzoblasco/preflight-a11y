<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Animated landing</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; padding: 40px; background: #f4f5f7; }
      .chip {
        display: inline-block;
        padding: 4px 12px;
        border-radius: 999px;
        background: #eef0f3;
        /* Correct settled value: #575e6b on #f4f5f7 is 5.15:1. */
        color: #575e6b;
        font-size: 12px;
        /* The bug: a staggered fade that leaves the element half-transparent
           long enough for a scanner to sample it. */
        opacity: 0;
        animation: fadeIn 1.4s ease forwards;
      }
      .chip:nth-child(1) { animation-delay: 0.35s; }
      .chip:nth-child(2) { animation-delay: 0.38s; }
      .chip:nth-child(3) { animation-delay: 0.41s; }
      @keyframes fadeIn { to { opacity: 1; } }
    </style>
  </head>
  <body>
    <main>
      <h1>Animated landing</h1>
      <p style="color: #575e6b">Body text that is correct in its settled state.</p>
      <div>
        <span class="chip">Conexión segura</span>
        <span class="chip">Multi-usuario</span>
        <span class="chip">Métricas</span>
      </div>
    </main>
  </body>
</html>
